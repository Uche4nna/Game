<!DOCTYPE html>
<html>
  <head>
    <title>game of rock</title>
    <link rel="stylesheet"
    href="rock-paper-scissors.css "
    >
  </head>
  <body>
    
    <p>Rock Paper Scissors game</p>
    <button onclick=" 
    action('Rock')"
    class="move">
    <img src="rock-emoji.png" class="icon"></button>
    <button  onclick=" 
    action('Paper')"
    class="move"
    ><img src="paper-emoji.png" class="icon"></button>

    <button onclick=" 
    action('Scissors')"
    class="move"
    ><img src="scissors-emoji.png" class="icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves">
    </p>

    <p class="js-button score "></p>
    

    <button onclick="
    score.loose=0;
    score.wins=0;
    score.tie=0;
    localStorage.removeItem('score');
    updatescoreElement()"
    class="resert">
    Resert
  </button>
    <script src="Scripts.js"></script>
    
  </body>
</html>
